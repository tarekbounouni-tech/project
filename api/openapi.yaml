        "200":
          description: Tournoi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTournament"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Admin — Tournois]
      operationId: adminUpdateTournament
      summary: Remplacer le contenu d'un tournoi
      description: |
        Remplace toutes les informations éditables, **y compris la liste des
        tableaux** (les tableaux absents sont supprimés, ceux sans `id` sont
        créés). Met à jour la date de vérification (RG-07).
        Le statut de publication se change uniquement via les actions dédiées
        (`/publish`, `/reject`, `/archive`).
        `version` (valeur de `updatedAt` lue) protège contre l'écrasement
        d'une modification concurrente : 409 si le tournoi a changé entre-temps.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTournamentUpdateInput"
      responses:
        "200":
          description: Tournoi mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTournament"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Admin — Tournois]
      operationId: adminDeleteTournament
      summary: Supprimer un tournoi jamais publié
      description: Seuls les brouillons et tournois refusés peuvent être supprimés ; un tournoi publié s'archive (RG-04).
      security:
        - bearerAuth: []
      responses:
        "204":
