# =============================================================================
# Contrat d'API — VolleySpot (nom provisoire)
# -----------------------------------------------------------------------------
# SOURCE DE VÉRITÉ de l'API (décision D-03) :
#   * le backend Go génère ses types et l'interface de ses handlers depuis ce
#     fichier (oapi-codegen, mode strict server, routeur chi) ;
#   * l'app mobile et le back-office génèrent leur client TypeScript depuis ce
#     fichier (openapi-typescript + openapi-fetch).
# Toute évolution de l'API commence par une modification de ce fichier.
#
# Conventions (voir docs/04-api.md) :
#   * JSON, champs en camelCase, dates « YYYY-MM-DD », heures « HH:MM »,
#     horodatages ISO 8601 en UTC ;
#   * erreurs au format RFC 9457 (application/problem+json) ;
#   * pagination par curseur opaque (nextCursor) ;
#   * les codes des référentiels (formats, niveaux…) sont envoyés seuls ; leurs
#     libellés sont fournis une fois par GET /v1/reference.
# =============================================================================
openapi: 3.0.3

info:
  title: VolleySpot API
  version: 1.0.0
  description: |
    API REST de la plateforme de tournois de volley-ball.

    Trois espaces :
    - **Public** : consultation des tournois, propositions et signalements (sans compte).
    - **Utilisateur** (`/v1/me`) : compte et favoris (jeton requis).
    - **Administration** (`/v1/admin`) : gestion du catalogue et modération (rôle `admin`).
  contact:
    name: VolleySpot
  license:
    name: Propriétaire

servers:
  - url: http://localhost:8080
    description: Développement local
  - url: https://api.volleyspot.app
    description: Production (domaine provisoire)

tags:
  - name: Système
    description: Santé du service
  - name: Référentiels
    description: Listes de valeurs et communes
  - name: Tournois
    description: Consultation publique des tournois
  - name: Organisateurs
    description: Consultation publique des organisateurs
  - name: Contributions
    description: Propositions de tournois et signalements (sans compte)
  - name: Médias
    description: Envoi d'images
  - name: Authentification
    description: Inscription, connexion, sessions, mot de passe
  - name: Mon compte
    description: Profil et suppression du compte
  - name: Favoris
    description: Tournois enregistrés par l'utilisateur
  - name: Admin — Tableau de bord
    description: Indicateurs du back-office
  - name: Admin — Tournois
    description: Gestion des éditions, publication, duplication
  - name: Admin — Séries
    description: Tournois récurrents
  - name: Admin — Organisateurs
    description: Clubs et autres organisateurs
  - name: Admin — Lieux
    description: Lieux et géocodage des adresses
  - name: Admin — Propositions
    description: Modération des tournois proposés
  - name: Admin — Signalements
    description: Traitement des signalements

# Par défaut, aucune authentification n'est requise : chaque opération qui en
# a besoin le déclare explicitement.
security: []

paths:
  # ===========================================================================
  # SYSTÈME
  # ===========================================================================
  /healthz:
    get:
      tags: [Système]
      operationId: getHealth
      summary: Le service répond (sonde de vivacité)
      responses:
        "200":
          description: Service démarré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /readyz:
    get:
      tags: [Système]
      operationId: getReadiness
      summary: Le service et la base de données sont disponibles (sonde de disponibilité)
      responses:
        "200":
          description: Prêt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ===========================================================================
  # RÉFÉRENTIELS
  # ===========================================================================
  /v1/reference:
    get:
      tags: [Référentiels]
      operationId: getReferenceData
      summary: Toutes les listes de valeurs en un appel
      description: |
        Formats, catégories, niveaux, terrains, badges, types d'organisateurs,
        régions et départements (avec leur statut d'ouverture). Réponse mise en
        cache par les clients ; change très rarement.
      responses:
        "200":
          description: Référentiels
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceData"

  /v1/cities:
    get:
      tags: [Référentiels]
      operationId: searchCities
      summary: Auto-complétion des communes
      description: Recherche par nom (insensible casse, accents, fautes légères) ou par code postal.
      parameters:
        - name: q
          in: query
          required: true
          description: Début du nom ou code postal (2 caractères minimum)
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: activeOnly
          in: query
          description: Limiter aux départements ouverts dans l'application
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/SmallLimit"
      responses:
        "200":
          description: Communes correspondantes, les plus pertinentes d'abord
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ===========================================================================
  # TOURNOIS (PUBLIC)
  # ===========================================================================
  /v1/tournaments:
    get:
      tags: [Tournois]
      operationId: listTournaments
      summary: Liste et recherche des tournois publiés
      description: |
        Tournois publiés, triés par date de début (ou date décroissante pour
        `period=past`). Tous les filtres sont facultatifs et combinables.
        Les filtres de tableau (format, catégorie, niveau, terrain) retiennent
        un tournoi si **au moins un de ses tableaux** correspond à tous ces
        filtres à la fois. Un filtre répété (`format=2x2&format=4x4`) signifie
        « l'un ou l'autre ».
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/DepartmentFilter"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/FormatFilter"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/LevelFilter"
        - $ref: "#/components/parameters/SurfaceFilter"
        - name: organizerId
          in: query
          description: Tournois d'un organisateur
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Une page de tournois
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentSummaryPage"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/tournaments/{tournamentId}:
    parameters:
      - $ref: "#/components/parameters/TournamentId"
    get:
      tags: [Tournois]
      operationId: getTournament
      summary: Fiche détaillée d'un tournoi publié
      responses:
        "200":
          description: Fiche tournoi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tournaments/{tournamentId}/events:
    parameters:
      - $ref: "#/components/parameters/TournamentId"
    post:
      tags: [Tournois]
      operationId: recordTournamentEvent
      summary: Comptabiliser une vue de fiche ou un clic « S'inscrire » (anonyme)
      description: Statistiques anonymes (RG-16). Aucune donnée personnelle n'est enregistrée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentEventInput"
      responses:
        "204":
          description: Enregistré
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/tournaments/{tournamentId}/reports:
    parameters:
      - $ref: "#/components/parameters/TournamentId"
    post:
      tags: [Contributions]
      operationId: createReport
      summary: Signaler une erreur sur une fiche
      description: Accessible sans compte. Si l'utilisateur est connecté, le signalement lui est rattaché.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Signalement enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResource"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ===========================================================================
  # ORGANISATEURS (PUBLIC)
  # ===========================================================================
  /v1/organizers/{organizerId}:
    parameters:
      - $ref: "#/components/parameters/OrganizerId"
    get:
      tags: [Organisateurs]
      operationId: getOrganizer
      summary: Fiche publique d'un organisateur
      description: Ses tournois s'obtiennent via `GET /v1/tournaments?organizerId=…`.
      responses:
        "200":
          description: Organisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerPublic"
        "404":
          $ref: "#/components/responses/NotFound"

  # ===========================================================================
  # CONTRIBUTIONS
  # ===========================================================================
  /v1/submissions:
    post:
      tags: [Contributions]
      operationId: createSubmission
      summary: Proposer un tournoi
      description: |
        Accessible sans compte. La proposition arrive dans la file de
        modération (RG-09). Pour joindre une affiche, l'envoyer d'abord via
        `POST /v1/media` puis indiquer son identifiant.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Proposition enregistrée, en attente de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResource"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ===========================================================================
  # MÉDIAS
  # ===========================================================================
  /v1/media:
    post:
      tags: [Médias]
      operationId: uploadMedia
      summary: Envoyer une image (affiche ou logo)
      description: |
        JPEG, PNG ou WebP, 10 Mo maximum. L'image est vérifiée, débarrassée de
        ses métadonnées (EXIF), redimensionnée en deux tailles puis stockée.
        - **Sans compte** : uniquement `kind=poster`, image non publique
          jusqu'à validation de la proposition associée ; débit limité.
        - **Administrateur** : image publique immédiatement.
        Les images non rattachées à un contenu sous 24 h sont supprimées.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier image (≤ 10 Mo)
                kind:
                  $ref: "#/components/schemas/MediaKind"
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Image enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ===========================================================================
  # AUTHENTIFICATION
  # ===========================================================================
  /v1/auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Créer un compte
      description: Un e-mail de vérification est envoyé. L'utilisateur est connecté immédiatement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Compte créé
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Connecté
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshSession
      summary: Renouveler la session
      description: |
        Échange un jeton de renouvellement contre une nouvelle paire de jetons
        (rotation). Le jeton est lu dans le corps (application mobile) ou, à
        défaut, dans le cookie `refresh_token` (back-office web).
        La réutilisation d'un jeton déjà échangé révoque toute la session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Nouveaux jetons
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Se déconnecter (révoque le jeton de renouvellement)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "204":
          description: Déconnecté (réponse identique si le jeton était déjà invalide)

  /v1/auth/verify-email:
    post:
      tags: [Authentification]
      operationId: verifyEmail
      summary: Confirmer l'adresse e-mail (lien reçu par e-mail)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "204":
          description: Adresse confirmée
        "410":
          $ref: "#/components/responses/Gone"

  /v1/auth/resend-verification:
    post:
      tags: [Authentification]
      operationId: resendVerificationEmail
      summary: Renvoyer l'e-mail de vérification
      security:
        - bearerAuth: []
      responses:
        "204":
          description: E-mail renvoyé (ou adresse déjà vérifiée)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/forgot-password:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demander un lien de réinitialisation du mot de passe
      description: |
        Réponse identique que l'adresse existe ou non (ne révèle pas quels
        e-mails ont un compte). Le lien est valable 1 heure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Demande prise en compte
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/reset-password:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Définir un nouveau mot de passe (lien reçu par e-mail)
      description: Toutes les sessions existantes sont révoquées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 200
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "204":
          description: Mot de passe modifié
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ===========================================================================
  # MON COMPTE
  # ===========================================================================
  /v1/me:
    get:
      tags: [Mon compte]
      operationId: getMe
      summary: Mon profil
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Mon compte]
      operationId: updateMe
      summary: Modifier mon profil
      description: Seuls les champs présents sont modifiés ; `null` efface une valeur facultative.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeInput"
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/me/password:
    put:
      tags: [Mon compte]
      operationId: changePassword
      summary: Changer mon mot de passe
      description: Les autres sessions sont révoquées.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 128
                newPassword:
                  $ref: "#/components/schemas/Password"
      responses:
        "204":
          description: Mot de passe modifié
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/me/account-deletion:
    post:
      tags: [Mon compte]
      operationId: deleteMyAccount
      summary: Supprimer définitivement mon compte
      description: |
        Exigence RGPD, Google Play et App Store. Efface le compte, les favoris
        et toutes les sessions. Irréversible. Le mot de passe est demandé pour
        confirmer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 128
      responses:
        "204":
          description: Compte supprimé
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # FAVORIS
  # ===========================================================================
  /v1/me/favorites:
    get:
      tags: [Favoris]
      operationId: listMyFavorites
      summary: Mes tournois favoris
      description: Inclut les tournois annulés ou reportés (avec leur statut) pour que l'utilisateur soit informé.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Une page de favoris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/favorites/ids:
    get:
      tags: [Favoris]
      operationId: listMyFavoriteIds
      summary: Identifiants de tous mes favoris
      description: Permet d'afficher les cœurs « remplis » dans les listes sans charger les fiches.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identifiants
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items:
                      type: string
                      format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/favorites/{tournamentId}:
    parameters:
      - $ref: "#/components/parameters/TournamentId"
    put:
      tags: [Favoris]
      operationId: addFavorite
      summary: Ajouter un favori (idempotent)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Ajouté (ou déjà présent)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Favoris]
      operationId: removeFavorite
      summary: Retirer un favori (idempotent)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Retiré (ou absent)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ===========================================================================
  # ADMINISTRATION — TABLEAU DE BORD
  # ===========================================================================
  /v1/admin/dashboard:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminGetDashboard
      summary: Indicateurs du back-office
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Indicateurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================================================================
  # ADMINISTRATION — TOURNOIS
  # ===========================================================================
  /v1/admin/tournaments:
    get:
      tags: [Admin — Tournois]
      operationId: adminListTournaments
      summary: Tous les tournois, quel que soit leur statut
      security:
        - bearerAuth: []
      parameters:
        - name: publicationStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PublicationStatus"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/DepartmentFilter"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: organizerId
          in: query
          schema:
            type: string
            format: uuid
        - name: seriesId
          in: query
          schema:
            type: string
            format: uuid
        - name: staleOnly
          in: query
          description: Uniquement les tournois à venir non vérifiés depuis plus de 30 jours (RG-07)
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Une page de tournois
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTournamentSummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin — Tournois]
      operationId: adminCreateTournament
      summary: Créer un tournoi (brouillon)
      description: |
        Crée une édition en brouillon, avec ses tableaux. La série est soit
        existante (`seriesId`), soit créée à la volée (`newSeries`). Le lieu est
        soit existant (`venueId`), soit créé à la volée (`newVenue`).
        Si `submissionId` est fourni, la proposition correspondante est marquée
        acceptée et liée au tournoi, dans la même transaction.
