                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InvalidTransition"

# =============================================================================
# COMPOSANTS RÉUTILISABLES
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès (15 minutes) obtenu via /v1/auth/login, /register ou /refresh.

  headers:
    CacheControl:
      description: Directive de cache
      schema:
        type: string
        example: public, max-age=3600
    ETag:
      description: Empreinte de la ressource (requêtes conditionnelles If-None-Match)
      schema:
        type: string
    RetryAfter:
      description: Nombre de secondes à attendre avant de réessayer
      schema:
        type: integer
    RefreshCookie:
      description: |
        Back-office web uniquement (`client: web`) : cookie `refresh_token`
        HttpOnly, Secure, SameSite=Strict, limité au chemin /v1/auth.
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Paramètres
  # ---------------------------------------------------------------------------
  parameters:
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizerId:
      name: organizerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé dans `nextCursor` de la page précédente
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      description: Nombre d'éléments par page
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    SmallLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    Period:
      name: period
      in: query
      description: "`upcoming` (défaut) : tournois non terminés ; `past` : historique (RG-06)"
      schema:
        type: string
        enum: [upcoming, past]
        default: upcoming
    SearchQuery:
      name: q
      in: query
      description: Recherche texte (nom du tournoi, organisateur, commune), insensible casse et accents
      schema:
        type: string
        minLength: 2
        maxLength: 100
    DepartmentFilter:
      name: department
      in: query
      description: Code(s) de département, répétable (`department=29&department=56`)
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          $ref: "#/components/schemas/DepartmentCode"
    FromDate:
      name: from
      in: query
      description: Tournois se terminant à partir de cette date
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Tournois commençant au plus tard à cette date
      schema:
        type: string
        format: date
    FormatFilter:
      name: format
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/FormatCode"
    CategoryFilter:
      name: category
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/CategoryCode"
    LevelFilter:
      name: level
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/LevelCode"
    SurfaceFilter:
      name: surface
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/SurfaceCode"

  # ---------------------------------------------------------------------------
  # Réponses d'erreur (RFC 9457)
  # ---------------------------------------------------------------------------
  responses:
    ValidationError:
      description: Données invalides (détail par champ)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentification absente, invalide ou expirée
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Droits insuffisants
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflit (doublon, modification concurrente, ressource encore utilisée)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidTransition:
      description: Changement de statut non autorisé depuis le statut actuel
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Lien expiré ou déjà utilisé
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Fichier trop volumineux
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Type de fichier non accepté
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Trop de requêtes, réessayer plus tard
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: Service externe indisponible (ex. API Adresse)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Service temporairement indisponible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  # ---------------------------------------------------------------------------
  # Schémas
  # ---------------------------------------------------------------------------
  schemas:
    # ---- Types de base -------------------------------------------------------
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: 10 caractères minimum
    HttpUrl:
      type: string
      format: uri
      maxLength: 2000
      pattern: "^https?://"
    Phone:
      type: string
      pattern: '^\+?[0-9 .()-]{6,20}$'
    Time:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Heure locale « HH:MM »
      example: "09:30"
    InseeCode:
      type: string
      pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$"
      description: Code INSEE de commune
      example: "56034"
    DepartmentCode:
      type: string
      pattern: "^([0-9]{2}|2A|2B)$"
      example: "29"
    PostalCode:
      type: string
      pattern: "^[0-9]{5}$"
      example: "56340"
    Latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
    Longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180

    # ---- Codes des référentiels ---------------------------------------------
    # Ajouter une valeur = migration SQL + mise à jour de cette énumération
    # (décision volontaire : les clients disposent ainsi de types exhaustifs).
    FormatCode:
      type: string
      enum: ["2x2", "3x3", "4x4", "6x6", other]
    CategoryCode:
      type: string
      enum: [men, women, mixed, open]
    LevelCode:
      type: string
      enum: [beginner, leisure, intermediate, advanced, competitive]
    SurfaceCode:
      type: string
      enum: [indoor, outdoor, sand]
    TagCode:
      type: string
      enum: [charity, telethon, solidarity, special]
    OrganizerTypeCode:
      type: string
      enum: [club, association, municipality, business, individual, other]
    Role:
      type: string
      enum: [user, organizer, admin]

    # ---- Statuts -------------------------------------------------------------
    PublicationStatus:
      type: string
      enum: [draft, pending, published, rejected, archived]
    EventStatus:
      type: string
      enum: [scheduled, postponed, cancelled]
    RegistrationStatus:
      type: string
      enum: [not_open_yet, open, full, closed]
    RegistrationMode:
      type: string
      enum: [external_link, on_site, phone_or_email]
    SubmissionStatus:
      type: string
      enum: [pending, accepted, rejected, spam]
    ReportReason:
      type: string
      enum: [wrong_date, cancelled, dead_link, full, other]
    ReportStatus:
      type: string
      enum: [open, resolved, dismissed]
    MediaKind:
      type: string
      enum: [poster, logo]
    PriceUnit:
      type: string
      enum: [team, player]

    # ---- Erreurs ---------------------------------------------------------------
    Problem:
      type: object
      description: Erreur au format RFC 9457 « Problem Details »
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI identifiant le type d'erreur
          example: https://volleyspot.app/errors/validation
        title:
          type: string
          example: Données invalides
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: La date de fin doit être postérieure à la date de début.
        code:
          type: string
          description: Code stable exploitable par les clients
          example: validation_failed
        errors:
          type: array
          description: Erreurs par champ (validation)
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
          description: Identifiant de la requête, à communiquer en cas de signalement de bug

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Chemin du champ (ex. `divisions[0].priceCents`)
          example: endDate
        message:
          type: string
          example: doit être postérieure ou égale à startDate

    # ---- Système ---------------------------------------------------------------
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Version déployée (commit)

    CreatedResource:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000

    # ---- Référentiels ----------------------------------------------------------
    ReferenceData:
      type: object
      required: [formats, categories, levels, surfaces, tags, organizerTypes, regions, departments]
      properties:
        formats:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/FormatCode"
              label:
                type: string
              playersOnCourt:
                type: integer
                nullable: true
        categories:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/CategoryCode"
              label:
                type: string
        levels:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/LevelCode"
              label:
                type: string
        surfaces:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/SurfaceCode"
              label:
                type: string
        tags:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/TagCode"
              label:
                type: string
        organizerTypes:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code:
                $ref: "#/components/schemas/OrganizerTypeCode"
              label:
                type: string
        regions:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
              name:
                type: string
        departments:
          type: array
          items:
            $ref: "#/components/schemas/Department"

    Department:
      type: object
      required: [code, name, regionCode, isActive]
      properties:
        code:
          $ref: "#/components/schemas/DepartmentCode"
        name:
          type: string
          example: Finistère
        regionCode:
          type: string
          example: "53"
        isActive:
          type: boolean
          description: Département couvert par l'application

    City:
      type: object
      required: [inseeCode, name, departmentCode, postalCodes]
      properties:
        inseeCode:
          $ref: "#/components/schemas/InseeCode"
        name:
          type: string
          example: Carnac
        departmentCode:
          $ref: "#/components/schemas/DepartmentCode"
        postalCodes:
          type: array
          items:
            $ref: "#/components/schemas/PostalCode"

    CityRef:
      type: object
      description: Commune résumée
      required: [inseeCode, name, departmentCode]
      properties:
        inseeCode:
          $ref: "#/components/schemas/InseeCode"
        name:
          type: string
        departmentCode:
          $ref: "#/components/schemas/DepartmentCode"

    # ---- Médias ----------------------------------------------------------------
    Image:
      type: object
      description: Image publique en deux tailles
      required: [thumbUrl, largeUrl, width, height]
      properties:
        thumbUrl:
          type: string
          format: uri
          description: Vignette (400 px de large)
        largeUrl:
          type: string
          format: uri
          description: Grand format (1200 px de large)
        width:
          type: integer
        height:
          type: integer

    Media:
      type: object
      required: [id, kind, image, isPublic, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MediaKind"
        image:
          $ref: "#/components/schemas/Image"
        isPublic:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ---- Tournois : vues publiques ---------------------------------------------
    DivisionSummary:
      type: object
      description: Caractéristiques agrégées des tableaux, pour les cartes de la liste
      required: [formats, categories, levels, surfaces, minPriceCents]
      properties:
        formats:
          type: array
          items:
            $ref: "#/components/schemas/FormatCode"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCode"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/LevelCode"
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceCode"
        minPriceCents:
          type: integer
          nullable: true
          description: Prix le plus bas parmi les tableaux (null si non communiqué)

    TournamentSummary:
      type: object
      description: Tournoi tel qu'affiché dans une liste (carte)
      required:
        - id
        - name
        - startDate
        - endDate
        - city
        - organizerName
        - divisionSummary
        - tags
        - registrationStatus
        - eventStatus
        - closingSoon
        - isPast
        - startTime
        - venueName
        - poster
        - postponedToDate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tournoi de la Grande Plage
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        startTime:
          type: string
          allOf:
            - $ref: "#/components/schemas/Time"
          nullable: true
        city:
          $ref: "#/components/schemas/CityRef"
        venueName:
          type: string
          nullable: true
        organizerName:
          type: string
        poster:
          type: object
          allOf:
            - $ref: "#/components/schemas/Image"
          nullable: true
          description: null = afficher le visuel générique du terrain (RG-12)
        divisionSummary:
          $ref: "#/components/schemas/DivisionSummary"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagCode"
        registrationStatus:
          $ref: "#/components/schemas/RegistrationStatus"
        eventStatus:
          $ref: "#/components/schemas/EventStatus"
        postponedToDate:
          type: string
          format: date
          nullable: true
        closingSoon:
          type: boolean
          description: Badge calculé « Inscriptions bientôt clôturées » (RG-08)
        isPast:
          type: boolean

    TournamentSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TournamentSummary"
        nextCursor:
          type: string
          nullable: true
          description: null = dernière page

    Division:
      type: object
      description: Tableau d'un tournoi
      required: [id, format, category, surface, levels, playersPerTeamMin, playersPerTeamMax, priceCents, priceUnit, maxTeams, scheduleNote, conditions]
      properties:
        id:
          type: string
          format: uuid
        format:
          $ref: "#/components/schemas/FormatCode"
        category:
          $ref: "#/components/schemas/CategoryCode"
        surface:
          $ref: "#/components/schemas/SurfaceCode"
        levels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LevelCode"
        playersPerTeamMin:
          type: integer
          minimum: 1
          maximum: 12
        playersPerTeamMax:
          type: integer
          minimum: 1
          maximum: 12
        priceCents:
          type: integer
          nullable: true
          description: null = non communiqué ; 0 = gratuit
        priceUnit:
          type: string
          allOf:
            - $ref: "#/components/schemas/PriceUnit"
          nullable: true
        maxTeams:
          type: integer
          nullable: true
        scheduleNote:
          type: string
          nullable: true
        conditions:
          type: string
          nullable: true

    VenuePublic:
      type: object
      required: [city, latitude, longitude, name, addressLine, postalCode, isApproximate]
      properties:
        name:
          type: string
          nullable: true
        addressLine:
          type: string
          nullable: true
        postalCode:
          type: string
          allOf:
            - $ref: "#/components/schemas/PostalCode"
          nullable: true
        city:
          $ref: "#/components/schemas/CityRef"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        isApproximate:
          type: boolean
          description: true si la position est le centre de la commune

    Registration:
      type: object
      required: [mode, status, url, instructions, deadline]
      properties:
        mode:
          $ref: "#/components/schemas/RegistrationMode"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        url:
          type: string
          format: uri
          nullable: true
        instructions:
          type: string
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true

    Contact:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true

      required: [email, phone, url]
    OrganizerRef:
      type: object
      required: [id, name, type, logo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrganizerTypeCode"
        logo:
          type: object
          allOf:
            - $ref: "#/components/schemas/Image"
          nullable: true

    EditionRef:
      type: object
      description: Autre édition de la même série
      required: [id, name, startDate]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date

    TournamentDetail:
      description: Fiche tournoi complète (vue publique)
      allOf:
        - $ref: "#/components/schemas/TournamentSummary"
        - type: object
          required: [organizer, venue, registration, contact, divisions, verifiedAt, otherEditions, seriesId, description, rulesText, rulesUrl]
          properties:
            organizer:
              $ref: "#/components/schemas/OrganizerRef"
            seriesId:
              type: string
              format: uuid
            venue:
              $ref: "#/components/schemas/VenuePublic"
            description:
              type: string
              nullable: true
            rulesText:
              type: string
              nullable: true
            rulesUrl:
              type: string
              format: uri
              nullable: true
            registration:
              $ref: "#/components/schemas/Registration"
            contact:
              $ref: "#/components/schemas/Contact"
            divisions:
              type: array
              description: Détail de chaque tableau, dans l'ordre d'affichage
              items:
                $ref: "#/components/schemas/Division"
            verifiedAt:
              type: string
              format: date-time
              description: Affiché « Vérifié le … » (RG-07)
            otherEditions:
              type: array
              description: Autres éditions publiées de la même série (historique)
              items:
                $ref: "#/components/schemas/EditionRef"

    TournamentEventInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [view, registration_click]

    # ---- Organisateurs ---------------------------------------------------------
    OrganizerPublic:
      type: object
      required: [id, name, type, description, city, logo, email, phone, websiteUrl, facebookUrl, instagramUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrganizerTypeCode"
        description:
          type: string
          nullable: true
        city:
          type: object
          allOf:
            - $ref: "#/components/schemas/CityRef"
          nullable: true
        logo:
          type: object
          allOf:
            - $ref: "#/components/schemas/Image"
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        facebookUrl:
          type: string
          format: uri
          nullable: true
        instagramUrl:
          type: string
          format: uri
          nullable: true

    # ---- Contributions ---------------------------------------------------------
    SubmissionInput:
      type: object
      description: |
        Formulaire « Proposer un tournoi ». Champs obligatoires réduits au
        minimum (CTB-01). `website` est un champ « pot de miel » invisible :
        s'il est rempli, la proposition est ignorée silencieusement (anti-spam).
      required: [tournamentName, startDate, cityName, formats]
      properties:
        tournamentName:
          type: string
          minLength: 2
          maxLength: 150
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        cityName:
          type: string
          minLength: 1
          maxLength: 100
        cityInsee:
          $ref: "#/components/schemas/InseeCode"
        venueOrAddress:
          type: string
          maxLength: 250
        organizerName:
          type: string
          maxLength: 150
        formats:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/FormatCode"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCode"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/LevelCode"
        surfaces:
          type: array
          items:
            $ref: "#/components/schemas/SurfaceCode"
        priceInfo:
          type: string
          maxLength: 200
          description: Texte libre (« 10 € par joueur »)
        registrationUrl:
          $ref: "#/components/schemas/HttpUrl"
        sourceUrl:
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          description: Où l'information a été vue (post Facebook, site…)
        description:
          type: string
          maxLength: 5000
        posterMediaId:
          type: string
          format: uuid
        submitterEmail:
          allOf:
            - $ref: "#/components/schemas/Email"
          description: Facultatif, pour être recontacté
        isOrganizer:
          type: boolean
          description: Le proposant est l'organisateur du tournoi
        website:
          type: string
          maxLength: 200
          description: Pot de miel anti-spam — doit rester vide

    ReportInput:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          maxLength: 1000
        website:
          type: string
          maxLength: 200
          description: Pot de miel anti-spam — doit rester vide

    # ---- Authentification et compte ------------------------------------------
    ClientType:
      type: string
      enum: [mobile, web]
      default: mobile
      description: |
        `mobile` : le jeton de renouvellement est renvoyé dans le corps.
        `web` : il est placé dans un cookie HttpOnly et absent du corps.

    RegisterInput:
      type: object
      required: [email, password, acceptPrivacyPolicy]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        acceptPrivacyPolicy:
          type: boolean
          enum: [true]
          description: Doit valoir true
        client:
          $ref: "#/components/schemas/ClientType"

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          maxLength: 128
        client:
          $ref: "#/components/schemas/ClientType"

    RefreshInput:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 200
          description: Obligatoire pour l'application mobile ; absent pour le web (cookie)
        client:
          $ref: "#/components/schemas/ClientType"

    TokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 200

    AuthSession:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken:
          type: string
          description: "JWT à envoyer dans l'en-tête Authorization: Bearer …"
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Présent uniquement pour `client = mobile`
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, role, emailVerified, createdAt, displayName, preferredDepartmentCode]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: "#/components/schemas/Email"
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        preferredDepartmentCode:
          type: string
          allOf:
            - $ref: "#/components/schemas/DepartmentCode"
          nullable: true
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UpdateMeInput:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
          nullable: true
        preferredDepartmentCode:
          type: string
          allOf:
            - $ref: "#/components/schemas/DepartmentCode"
          nullable: true

    # ---- Administration : tournois ---------------------------------------------
    AdminDashboard:
      type: object
      required:
        - pendingSubmissions
        - openReports
        - pendingTournaments
        - upcomingPublished30Days
        - staleTournaments
      properties:
        pendingSubmissions:
          type: integer
        openReports:
          type: integer
        pendingTournaments:
          type: integer
        upcomingPublished30Days:
          type: integer
          description: Tournois publiés dans les 30 prochains jours
        staleTournaments:
          type: integer
          description: Tournois à venir non vérifiés depuis plus de 30 jours

    AdminTournamentSummary:
      description: Ligne de la liste du back-office
      allOf:
        - $ref: "#/components/schemas/TournamentSummary"
        - type: object
          required: [publicationStatus, seriesId, verifiedAt, updatedAt]
          properties:
            publicationStatus:
              $ref: "#/components/schemas/PublicationStatus"
            seriesId:
              type: string
              format: uuid
            verifiedAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AdminTournamentSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTournamentSummary"
        nextCursor:
          type: string
          nullable: true

    AdminTournament:
      description: Tournoi complet pour le back-office (inclut les champs internes)
      allOf:
        - $ref: "#/components/schemas/TournamentDetail"
        - type: object
          required: [publicationStatus, seriesId, venueId, createdAt, updatedAt, rejectionReason, publishedAt, posterMediaId, sourceNote, submissionId, openReportsCount]
          properties:
            publicationStatus:
              $ref: "#/components/schemas/PublicationStatus"
            rejectionReason:
              type: string
              nullable: true
            publishedAt:
              type: string
              format: date-time
              nullable: true
            venueId:
              type: string
              format: uuid
            posterMediaId:
              type: string
              format: uuid
              nullable: true
            sourceNote:
              type: string
              nullable: true
              description: Interne — jamais exposé publiquement
            submissionId:
              type: string
              format: uuid
              nullable: true
              description: Proposition d'origine, le cas échéant
            openReportsCount:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DivisionInput:
      type: object
      required: [format, category, surface, levels, playersPerTeamMin, playersPerTeamMax]
      properties:
        id:
          type: string
          format: uuid
          description: Absent = nouveau tableau ; présent = tableau existant à mettre à jour
        format:
          $ref: "#/components/schemas/FormatCode"
        category:
          $ref: "#/components/schemas/CategoryCode"
        surface:
          $ref: "#/components/schemas/SurfaceCode"
        levels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LevelCode"
        playersPerTeamMin:
          type: integer
          minimum: 1
          maximum: 12
        playersPerTeamMax:
          type: integer
          minimum: 1
          maximum: 12
        priceCents:
          type: integer
          minimum: 0
          maximum: 100000
          nullable: true
        priceUnit:
          type: string
          allOf:
            - $ref: "#/components/schemas/PriceUnit"
          nullable: true
        maxTeams:
          type: integer
          minimum: 1
          maximum: 1000
          nullable: true
        scheduleNote:
          type: string
          maxLength: 200
          nullable: true
        conditions:
          type: string
          maxLength: 1000
          nullable: true

    TournamentContentInput:
      type: object
      description: Champs éditables d'une édition (communs à la création et à la modification)
      required: [name, startDate, registrationMode, registrationStatus, eventStatus, divisions]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Par défaut égale à startDate
        startTime:
          type: string
          allOf:
            - $ref: "#/components/schemas/Time"
          nullable: true
        posterMediaId:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          maxLength: 10000
          nullable: true
        rulesText:
          type: string
          maxLength: 20000
          nullable: true
        rulesUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true
        registrationMode:
          $ref: "#/components/schemas/RegistrationMode"
        registrationUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true
          description: Obligatoire si registrationMode = external_link
        registrationInstructions:
          type: string
          maxLength: 500
          nullable: true
        registrationDeadline:
          type: string
          format: date
          nullable: true
        registrationStatus:
          $ref: "#/components/schemas/RegistrationStatus"
        eventStatus:
          $ref: "#/components/schemas/EventStatus"
        postponedToDate:
          type: string
          format: date
          nullable: true
          description: Uniquement si eventStatus = postponed
        tags:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TagCode"
        contactEmail:
          type: string
          allOf:
            - $ref: "#/components/schemas/Email"
          nullable: true
        contactPhone:
          type: string
          allOf:
            - $ref: "#/components/schemas/Phone"
          nullable: true
        contactUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true
        sourceNote:
          type: string
          maxLength: 1000
          nullable: true
        divisions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/DivisionInput"

    NewSeriesInput:
      type: object
      required: [organizerId, name]
      properties:
        organizerId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 150

    AdminTournamentCreateInput:
      description: |
        Création : exactement un parmi `seriesId` / `newSeries`, et exactement
        un parmi `venueId` / `newVenue` (vérifié par l'API, 422 sinon).
      allOf:
        - $ref: "#/components/schemas/TournamentContentInput"
        - type: object
          properties:
            seriesId:
              type: string
              format: uuid
            newSeries:
              $ref: "#/components/schemas/NewSeriesInput"
            venueId:
              type: string
              format: uuid
            newVenue:
              $ref: "#/components/schemas/VenueInput"
            submissionId:
              type: string
              format: uuid
              description: Proposition acceptée par cette création

    AdminTournamentUpdateInput:
      allOf:
        - $ref: "#/components/schemas/TournamentContentInput"
        - type: object
          required: [venueId, version]
          properties:
            venueId:
              type: string
              format: uuid
            version:
              type: string
              format: date-time
              description: Valeur de `updatedAt` lue avant modification (verrouillage optimiste)

    DuplicateInput:
      type: object
      required: [startDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        name:
          type: string
          minLength: 2
          maxLength: 150
          description: Par défaut, le nom de l'édition copiée (sans l'année éventuelle)

    TournamentStats:
      type: object
      required: [totalViews, totalRegistrationClicks, days]
      properties:
        totalViews:
          type: integer
        totalRegistrationClicks:
          type: integer
        days:
          type: array
          items:
            type: object
            required: [day, views, registrationClicks]
            properties:
              day:
                type: string
                format: date
              views:
                type: integer
              registrationClicks:
                type: integer

    AuditEntry:
      type: object
      required: [id, action, createdAt, actor, changes]
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
          example: publish
        actor:
          type: object
          nullable: true
          required: [id, displayName]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
              nullable: true
        changes:
          type: object
          nullable: true
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditEntryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          nullable: true

    # ---- Administration : séries -----------------------------------------------
    Series:
      type: object
      required: [id, name, organizer, editionsCount, lastEditionDate]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        organizer:
          $ref: "#/components/schemas/OrganizerRef"
        editionsCount:
          type: integer
        lastEditionDate:
          type: string
          format: date
          nullable: true

    SeriesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Series"
        nextCursor:
          type: string
          nullable: true

    SeriesUpdateInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        organizerId:
          type: string
          format: uuid

    # ---- Administration : organisateurs ----------------------------------------
    OrganizerInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        type:
          $ref: "#/components/schemas/OrganizerTypeCode"
        description:
          type: string
          maxLength: 5000
          nullable: true
        cityInsee:
          type: string
          allOf:
            - $ref: "#/components/schemas/InseeCode"
          nullable: true
        logoMediaId:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          allOf:
            - $ref: "#/components/schemas/Email"
          nullable: true
        phone:
          type: string
          allOf:
            - $ref: "#/components/schemas/Phone"
          nullable: true
        websiteUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true
        facebookUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true
        instagramUrl:
          type: string
          allOf:
            - $ref: "#/components/schemas/HttpUrl"
          nullable: true

    AdminOrganizer:
      allOf:
        - $ref: "#/components/schemas/OrganizerPublic"
        - type: object
          required: [seriesCount, createdAt, updatedAt, logoMediaId]
          properties:
            logoMediaId:
              type: string
              format: uuid
              nullable: true
            seriesCount:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    AdminOrganizerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrganizer"
        nextCursor:
          type: string
          nullable: true

    # ---- Administration : lieux ------------------------------------------------
    VenueInput:
      type: object
      required: [cityInsee, latitude, longitude, geocodingSource]
      properties:
        name:
          type: string
          maxLength: 150
          nullable: true
        addressLine:
          type: string
          maxLength: 250
          nullable: true
        postalCode:
          type: string
          allOf:
            - $ref: "#/components/schemas/PostalCode"
          nullable: true
        cityInsee:
          $ref: "#/components/schemas/InseeCode"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        geocodingSource:
          type: string
          enum: [ban, city_center, manual]

    Venue:
      type: object
      required: [id, city, latitude, longitude, geocodingSource, name, addressLine, postalCode]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        addressLine:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        city:
          $ref: "#/components/schemas/CityRef"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        geocodingSource:
          type: string
          enum: [ban, city_center, manual]

    VenuePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Venue"
        nextCursor:
          type: string
          nullable: true

    GeocodeSuggestion:
      type: object
      required: [label, cityInsee, cityName, latitude, longitude, score, addressLine, postalCode]
      properties:
        label:
          type: string
          description: Adresse complète normalisée
          example: Boulevard de la Plage 56340 Carnac
        addressLine:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        cityInsee:
          $ref: "#/components/schemas/InseeCode"
        cityName:
          type: string
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        score:
          type: number
          description: Pertinence (0 à 1)

    # ---- Administration : modération -------------------------------------------
    Submission:
      type: object
      required: [id, status, data, createdAt, poster, submittedByUserId, createdTournamentId, rejectionReason, reviewedAt, possibleDuplicates]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        data:
          $ref: "#/components/schemas/SubmissionInput"
        poster:
          type: object
          allOf:
            - $ref: "#/components/schemas/Image"
          nullable: true
        submittedByUserId:
          type: string
          format: uuid
          nullable: true
        createdTournamentId:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        possibleDuplicates:
          type: array
          description: Tournois existants ressemblant à la proposition (RG-10)
          items:
            $ref: "#/components/schemas/AdminTournamentSummary"
        createdAt:
          type: string
          format: date-time

    SubmissionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        nextCursor:
          type: string
          nullable: true

    Report:
      type: object
      required: [id, tournament, reason, status, createdAt, comment, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        tournament:
          type: object
          required: [id, name, startDate]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            startDate:
              type: string
              format: date
        reason:
          $ref: "#/components/schemas/ReportReason"
        comment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ReportStatus"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ReportPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        nextCursor:
          type: string
          nullable: true
